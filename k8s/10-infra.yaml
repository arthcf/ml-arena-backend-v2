# Infraestrutura: Postgres, Redis, RabbitMQ e MinIO. Cada um é um Deployment (1 réplica) com um
# Service ClusterIP: só os pods do cluster os alcançam, pelo nome (db, redis, rabbitmq, minio).
# Os painéis do RabbitMQ e do MinIO e a API do MinIO (links pré-assinados) também ganham um
# NodePort, porque o navegador precisa chegar neles.
#
# Dados em PersistentVolumeClaim (o kind cria o volume no nó). Estratégia Recreate: o pod velho
# solta o volume antes de o novo subir (o volume é ReadWriteOnce).

# ---------------------------------------------------------------- Postgres
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: ml-arena }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, namespace: ml-arena }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: ml-arena-config, key: DB_NAME } }
            # O volume monta um diretório com lost+found; o Postgres precisa de um subdiretório vazio.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 3
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: ml-arena }
spec:
  type: ClusterIP
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]

# ---------------------------------------------------------------- Redis (cache: sem volume)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: ml-arena }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: ml-arena }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]

# ---------------------------------------------------------------- RabbitMQ
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: rabbitmq-data, namespace: ml-arena }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: ml-arena }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      # Nome do nó fixo (rabbit@rabbitmq). Sem isto o hostname seria o nome do pod, que muda a
      # cada recriação, e o broker subiria como outro nó, deixando as filas órfãs no volume.
      hostname: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: RABBITMQ_PASSWORD } }
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            # A probe roda como root: se rodar antes de o broker criar o .erlang.cookie, ela o
            # cria com dono root e o broker (usuário rabbitmq) cai com "eacces" no 1º start.
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rabbitmq-data }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: ml-arena }
spec:
  type: ClusterIP
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672, targetPort: 5672 }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq-panel, namespace: ml-arena }
spec:
  type: NodePort
  selector: { app: rabbitmq }
  ports: [{ port: 15672, targetPort: 15672, nodePort: 31672 }]

# ---------------------------------------------------------------- MinIO (imagem Silo)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: ml-arena }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: ml-arena }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: MINIO_ROOT_PASSWORD } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: ml-arena }
spec:
  type: ClusterIP
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000 }]
---
# O navegador abre os links pré-assinados em localhost:9000 (NodePort 30900 pelo kind-config).
apiVersion: v1
kind: Service
metadata: { name: minio-public, namespace: ml-arena }
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
