# Aplicação: Jobs de preparação (migrations e bucket), API, worker e frontend.
#
# O Kubernetes não tem `depends_on`: cada pod sobe sozinho. A ordem vem de initContainers que
# esperam a dependência ficar pronta, e o resto é tolerado pelo próprio código (a API conecta
# no RabbitMQ na 1ª publicação; o worker tenta de novo a cada 5 s se a conexão cair).
#
# As imagens ml-arena-backend e ml-arena-frontend são construídas localmente e carregadas no
# kind (`kind load docker-image`); imagePullPolicy: Never impede que ele tente baixá-las.

# ---------------------------------------------------------------- Job: migrations
apiVersion: batch/v1
kind: Job
metadata: { name: migrate, namespace: ml-arena }
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-db
          image: ml-arena-backend
          imagePullPolicy: Never
          command: ["python", "-c", "import socket, time\nwhile True:\n    try:\n        socket.create_connection(('db', 5432), 2).close(); break\n    except OSError:\n        print('esperando o banco...', flush=True); time.sleep(2)"]
      containers:
        - name: migrate
          image: ml-arena-backend
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: ml-arena-config }
            - secretRef: { name: ml-arena-secrets }
---
# ---------------------------------------------------------------- Job: bucket no MinIO
apiVersion: batch/v1
kind: Job
metadata: { name: minio-init, namespace: ml-arena }
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mcli alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "esperando o MinIO..."; sleep 2
              done
              mcli mb --ignore-existing "local/$MINIO_BUCKET"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: MINIO_BUCKET
              valueFrom: { configMapKeyRef: { name: ml-arena-config, key: MINIO_BUCKET } }
---
# ---------------------------------------------------------------- API
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: ml-arena }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      initContainers:
        # Equivale ao depends_on do compose (migrate concluído): espera o banco estar na
        # última migration antes de a API aceitar requisições.
        - name: wait-migrations
          image: ml-arena-backend
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              head=$(alembic heads | cut -d' ' -f1)
              until [ "$(alembic current 2>/dev/null | cut -d' ' -f1)" = "$head" ]; do
                echo "esperando as migrations ($head)..."; sleep 2
              done
          envFrom:
            - configMapRef: { name: ml-arena-config }
            - secretRef: { name: ml-arena-secrets }
      containers:
        - name: api
          image: ml-arena-backend
          imagePullPolicy: Never
          command: ["fastapi", "run", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: { name: ml-arena-config }
            - secretRef: { name: ml-arena-secrets }
          ports: [{ containerPort: 8000 }]
          # readiness: só recebe tráfego quando responde; liveness: reinicia se travar.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
# Interno: o frontend chama http://api:8000 (ClusterIP, só dentro do cluster).
apiVersion: v1
kind: Service
metadata: { name: api, namespace: ml-arena }
spec:
  type: ClusterIP
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Externo: documentação da API em localhost:8000/docs (NodePort 30800 pelo kind-config).
apiVersion: v1
kind: Service
metadata: { name: api-docs, namespace: ml-arena }
spec:
  type: NodePort
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30800 }]
---
# ---------------------------------------------------------------- Worker
# Duas réplicas consumindo a mesma fila: o RabbitMQ divide as mensagens entre elas.
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: ml-arena }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      initContainers:
        - name: wait-migrations
          image: ml-arena-backend
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              head=$(alembic heads | cut -d' ' -f1)
              until [ "$(alembic current 2>/dev/null | cut -d' ' -f1)" = "$head" ]; do
                echo "esperando as migrations ($head)..."; sleep 2
              done
          envFrom:
            - configMapRef: { name: ml-arena-config }
            - secretRef: { name: ml-arena-secrets }
      containers:
        - name: worker
          image: ml-arena-backend
          imagePullPolicy: Never
          command: ["python", "-m", "worker.consumer"]
          envFrom:
            - configMapRef: { name: ml-arena-config }
            - secretRef: { name: ml-arena-secrets }
---
# ---------------------------------------------------------------- Frontend
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: ml-arena }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ml-arena-frontend
          imagePullPolicy: Never
          env:
            - name: API_BASE_URL
              valueFrom: { configMapKeyRef: { name: ml-arena-config, key: API_BASE_URL } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: ml-arena-secrets, key: FRONTEND_SECRET_KEY } }
          ports: [{ containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 5
---
# A aplicação em localhost:8001 (NodePort 30001 pelo kind-config).
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: ml-arena }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 8001, targetPort: 8001, nodePort: 30001 }]
