# Cluster local do kind (um nó). Os NodePorts são mapeados para as mesmas portas do compose em
# localhost, então MINIO_PUBLIC_URL continua http://localhost:9000 e os links pré-assinados
# abrem no navegador igual ao compose.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ml-arena
nodes:
  - role: control-plane
    # Versão fixa: sem isto o kind usa a mais nova que conhece, e o Kubernetes 1.37 não sobe
    # em máquinas com cgroup v1 (como o WSL2 usado nos testes).
    image: kindest/node:v1.34.3
    extraPortMappings:
      - { containerPort: 30001, hostPort: 8001 }   # frontend
      - { containerPort: 30800, hostPort: 8000 }   # API (/docs)
      - { containerPort: 30900, hostPort: 9000 }   # MinIO API (links pré-assinados)
      - { containerPort: 30901, hostPort: 9001 }   # console do MinIO
      - { containerPort: 31672, hostPort: 15672 }  # painel do RabbitMQ
