# EXEMPLO com valores falsos: não aplique este arquivo com senhas reais e não versione o real.
# O Secret de verdade é criado a partir do .env pelo `k8s/up.sh` (só as chaves abaixo):
#   kubectl -n ml-arena create secret generic ml-arena-secrets --from-env-file=<só os segredos>
# Atenção: Secret guarda os valores em base64, que é codificação, não criptografia. A proteção
# vem do RBAC (quem pode ler Secrets) e de não versionar o arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: ml-arena-secrets
  namespace: ml-arena
type: Opaque
stringData:
  DB_USER: mlarena
  DB_PASSWORD: troque-esta-senha
  SECRET_KEY: troque-esta-chave
  FRONTEND_SECRET_KEY: troque-esta-outra-chave
  MINIO_ROOT_USER: mlarena
  MINIO_ROOT_PASSWORD: troque-esta-senha
  RABBITMQ_USER: mlarena
  RABBITMQ_PASSWORD: troque-esta-senha
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
